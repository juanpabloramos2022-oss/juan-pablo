name: Generate Script V33.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar Script Simbiótico V33.8 (12 Escenas de Shock Biológico)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p output
          python scripts/generador_guion.py
          cp projects/actual/script.json output/script.json

      - name: Subir Artefacto de Guion
        uses: actions/upload-artifact@v4
        with:
          name: script-artifact
          path: output/script.json
          retention-days: 1
