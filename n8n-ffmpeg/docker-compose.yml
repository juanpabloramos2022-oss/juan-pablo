services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n_factory
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - NODES_EXCLUDE=[]
    volumes:
      - n8n_data:/home/node/.n8n
      - C:\tiktok:/data/shared

volumes:
  n8n_data: